[pytest]
# Add the project root to sys.path so that `tools.supervisory.*` imports work
# without needing to set PYTHONPATH manually.
pythonpath = .

# Ignore managed_components sub-directories that contain unrelated conftest.py
# files from Espressif example projects (e.g. require 'pexpect').
norecursedirs =
    .venv
    __pycache__
    .pytest_cache
    build
    managed_components
    components

# Default timeout for every test (overridden per-module where needed).
timeout = 5

# Show short local variables in tracebacks.
addopts = --tb=short
